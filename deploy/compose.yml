# The whole site (game page + co-op relay) with HTTPS.  Setup and updates:
# deploy/README.md.  Needs DOMAIN in a .env file next to this one.
services:
  smg:
    image: ghcr.io/reecen9696/galaxslop:latest
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN}
      ROOMS: ${ROOMS:-PLAY22}
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN} --to smg:8787
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
    depends_on:
      - smg
volumes:
  caddy_data:
