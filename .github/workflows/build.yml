# Compiles and links the desktop build on every push and PR, so neither
# agent can break the other's build unnoticed.  It cannot run the game:
# there is no disc data in CI, ever (AGENTS.md section 2).
name: build

on:
  push:
  pull_request:

jobs:
  macos:
    # arm64 runner; the Mac build is x86_64 (D-016), clang cross-compiles it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: ninja -C build/native -k 0 smg  # all errors in one run
      - name: Unit tests
        run: ninja -C build/native net_tests && ./build/native/net_tests
      - name: Check the image sits at 0x98000000
        run: |
          otool -l build/native/smg | grep -A3 -E 'segname (__PAGEZERO|__TEXT)$'
          file build/native/smg
          otool -l build/native/smg | grep -A3 'segname __TEXT$' | grep -E 'vmaddr +0x0*98000000$'

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libgl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
      - name: Configure
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: ninja -C build/native -k 0 smg  # all errors in one run

  web:
    # The browser build (docs/WEB.md).  Emscripten pinned to the version the
    # port was brought up with.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          ~/emsdk/emsdk install 6.0.12 && ~/emsdk/emsdk activate 6.0.12
      - name: Build (browser)
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release -DSMG_WEB_NODE=OFF
          ninja -C build/web -k 0 smg
      - name: Dev tools parse
        run: node --check web/dev-server.mjs && node --check tools/web/smoke.mjs

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cooker compiles
        run: python3 -m py_compile tools/rarc.py tools/cook/*.py

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
