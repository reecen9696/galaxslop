# Compiles and links the desktop build on every push and PR, so neither
# agent can break the other's build unnoticed.  It cannot run the game:
# there is no disc data in CI, ever (AGENTS.md section 2).
name: build

on:
  push:
  pull_request:

jobs:
  macos:
    # arm64 runner; the Mac build is x86_64 (D-016), clang cross-compiles it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: ninja -C build/native smg
      - name: Check the image sits at 0x98000000
        run: otool -l build/native/smg | grep -A3 'segname __TEXT$' | grep -q 'vmaddr 0x0000000098000000'

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libgl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
      - name: Configure
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: ninja -C build/native smg

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cooker compiles
        run: python3 -m py_compile tools/rarc.py tools/cook/*.py
